<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
<title id="t">ParlPDFeCH in one picture</title>
<desc id="d">A PDF goes in. The code rules give up to 7 head values with probability, page and text place. An eCH-0295 record in RDF comes out. In the fixed run, heads on Apertus-v1.5-8B added values for 2 fields.</desc>
