<text x="490" y="128" text-anchor="middle" font-size="25">with probability,</text>
<text x="490" y="162" text-anchor="middle" font-size="25">page, text place</text>
</g>
<line x1="668" y1="125" x2="718" y2="125" stroke="#55554f" stroke-width="4"/><polygon points="714,114 732,125 714,136" fill="#55554f"/>
