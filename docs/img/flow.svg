<path d="M95 62 h56 l26 26 v102 h-82 z" fill="#ffffff" stroke="#1f1f1e" stroke-width="3" stroke-linejoin="round"/>
<path d="M151 62 v26 h26" fill="none" stroke="#1f1f1e" stroke-width="3" stroke-linejoin="round"/>
<line x1="107" y1="104" x2="165" y2="104" stroke="#9a998f" stroke-width="5"/>
<line x1="107" y1="118" x2="165" y2="118" stroke="#9a998f" stroke-width="5"/>
<line x1="107" y1="132" x2="150" y2="132" stroke="#9a998f" stroke-width="5"/>
<rect x="80" y="146" width="68" height="32" rx="5" fill="#c8312a"/>
<text x="114" y="170" text-anchor="middle" font-size="22" font-weight="700" style="fill:#ffffff">PDF</text>
</g>
<line x1="248" y1="125" x2="298" y2="125" stroke="#55554f" stroke-width="4"/><polygon points="294,114 312,125 294,136" fill="#55554f"/>
