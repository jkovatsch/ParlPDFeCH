</g>
<path class="dl" d="M80 56h14m-6-5 6 5-6 5"/>
<rect class="dp" x="98" y="28" width="52" height="56" rx="3"/>
<path class="dl" d="M118 42c-5 0-1 12-7 14 6 2 2 14 7 14M130 42c5 0 1 12 7 14-6 2-2 14-7 14"/>
<text class="dt" x="124" y="100" text-anchor="middle">code rules</text>
<path class="dl" d="M150 44 164 30M150 56h14M150 68l14 14"/>
<rect class="dc" x="166" y="20" width="88" height="19" rx="9.5"/>
<rect class="dc" x="166" y="46.5" width="88" height="19" rx="9.5"/>
<rect class="dc" x="166" y="73" width="88" height="19" rx="9.5"/>
<text class="dt ds" x="210" y="33" text-anchor="middle">page furniture</text>
<text class="dt ds" x="210" y="59.5" text-anchor="middle">role: proposal</text>
<text class="dt ds" x="210" y="86" text-anchor="middle">author change</text></svg>
<text class="ca" x="12" y="208.5">A rule chain gives the role of the document and</text>
<text class="ca" x="12" y="223.0">of each block, from the PDF alone. The cascade</text>
<text class="ca" x="12" y="237.5">of eCH-0295 uses the kind of the document to</text>
<text class="ca" x="12" y="252.0">select the slots.</text>
</g>
<g transform="translate(10 317.0)">
<rect x="0" y="0" width="290" height="293.0" fill="#FBFAF6" stroke="#CFC9BC"/>
<circle cx="18" cy="18" r="10.5" fill="#FBFAF6" stroke="#1B1D22"/>
<text class="nu" x="18" y="22.2" text-anchor="middle">3</text>
<text class="ti" x="36" y="22.5">Apertus writes no text.</text>
<svg x="15" y="34" width="260" height="150" viewBox="0 0 260 150"><rect class="dp" x="20" y="8" width="40" height="52" rx="2"/>
<g class="dg">
<path d="M27 18h26M27 26h26M27 34h26M27 42h26M27 50h16"/>
</g>
<text class="dt ds" x="40" y="72" text-anchor="middle">whole document</text>
<rect class="dc" x="4" y="84" width="72" height="19" rx="9.5"/>
<text class="dt ds" x="40" y="97" text-anchor="middle">one question</text>
<path class="dl" d="M66 36 96 52m-9 0 9 0-4-8M78 92 96 76m-8-1 8 1-1 8"/>
<rect class="dp" x="98" y="40" width="58" height="46" rx="3"/>
<text class="dt db" x="127" y="67" text-anchor="middle">Apertus</text>
<path class="dl" d="M156 63h16m-6-5 6 5-6 5"/>
<text class="dt ds" x="216" y="20" text-anchor="middle">options</text>
<text class="dt" x="178" y="44">yes</text>
<rect class="df" x="206" y="36" width="44" height="9"/>
<text class="dt" x="178" y="64">no</text>
<rect class="df" x="206" y="56" width="9" height="9"/>
<path class="dg" d="M206 30v41"/>
<g class="dg">
<path d="M178 96h44M178 104h30"/>
</g>
<path class="dl" d="M172 110 228 90"/>
<text class="dt ds" x="216" y="126" text-anchor="middle">no text out</text></svg>
<text class="ca" x="12" y="208.5">Apertus-v1.5-8B gets the document and one</text>
<text class="ca" x="12" y="223.0">question. A linear head reads the hidden state</text>
<text class="ca" x="12" y="237.5">at the last token and gives a probability for</text>
<text class="ca" x="12" y="252.0">each option.</text>
<text class="no" x="12" y="266.5">In the run, values of Apertus entered for the</text>
<text class="no" x="12" y="281.0">affair type and the first author only.</text>
</g>
<g transform="translate(314 317.0)">
<rect x="0" y="0" width="290" height="293.0" fill="#FBFAF6" stroke="#CFC9BC"/>
<circle cx="18" cy="18" r="10.5" fill="#FBFAF6" stroke="#1B1D22"/>
<text class="nu" x="18" y="22.2" text-anchor="middle">4</text>
<text class="ti" x="36" y="22.5">Data with its source.</text>
<svg x="15" y="34" width="260" height="150" viewBox="0 0 260 150"><rect class="dp" x="10" y="10" width="112" height="108" rx="3"/>
<text class="dt db" x="20" y="27">record</text>
<rect class="dm" x="18" y="36" width="96" height="18" rx="2"/>
<text class="dt ds" x="24" y="49">value</text>
<rect class="dc" x="18" y="60" width="96" height="18" rx="2"/>
<path class="dg" d="M24 69h54"/>
<rect class="dd" x="18" y="84" width="96" height="24" rx="2"/>
<path class="dg" d="M24 92h70"/>
<text class="dt ds" x="24" y="104">unsure</text>
<rect class="dp" x="176" y="10" width="74" height="108" rx="2"/>
<g class="dg">
<path d="M186 24h54M186 34h54M186 54h54M186 64h40M186 74h54M186 84h54M186 94h30"/>
</g>
<rect class="dm" x="184" y="39" width="58" height="10" rx="1.5"/>
<path class="dg" d="M186 44h54"/>
<path class="dw" d="M114 45c26 0 40-1 70-1"/>
<path class="dl" d="M114 45c26 0 40-1 70-1"/>
<text class="dt" x="66" y="136" text-anchor="middle">record</text>
<text class="dt" x="213" y="136" text-anchor="middle">page and line</text></svg>
<text class="ca" x="12" y="208.5">A writer makes the record in Turtle and YAML,</text>
<text class="ca" x="12" y="223.0">each value with its probability, page and span.</text>
<text class="ca" x="12" y="237.5">A validator checks the record. A value below</text>
<text class="ca" x="12" y="252.0">the floor of the calibration goes into the</text>
<text class="ca" x="12" y="266.5">label file only.</text>
</g>
</svg>
