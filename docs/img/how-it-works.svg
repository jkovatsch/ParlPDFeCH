<g class="dg">
<path d="M152 25.5h84M152 44.5h84M152 63.5h56M152 82.5h84M152 101.5h34"/>
</g>
<text class="dt" x="53" y="136" text-anchor="middle">PDF page</text>
<text class="dt" x="194" y="136" text-anchor="middle">lines with frame</text></svg>
<text class="ca" x="12" y="208.5">Docling gives the text blocks. Code cuts them</text>
<text class="ca" x="12" y="223.0">into lines with page, frame and character</text>
<text class="ca" x="12" y="237.5">range.</text>
</g>
<g transform="translate(314 10.0)">
<rect x="0" y="0" width="290" height="293.0" fill="#FBFAF6" stroke="#CFC9BC"/>
<circle cx="18" cy="18" r="10.5" fill="#FBFAF6" stroke="#1B1D22"/>
<text class="nu" x="18" y="22.2" text-anchor="middle">2</text>
<text class="ti" x="36" y="22.5">Code rules decide first.</text>
<svg x="15" y="34" width="260" height="150" viewBox="0 0 260 150"><g class="dl">
<path d="M17 24h-4v11h4M71 24h4v11h-4"/>
<path d="M17 50h-4v11h4M71 50h4v11h-4"/>
<path d="M17 76h-4v11h4M71 76h4v11h-4"/>
