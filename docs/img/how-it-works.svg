<title id="t">How it works in four pictures</title>
<desc id="d">1. The page becomes lines. Line drawing: a page with blocks becomes a list of lines, each in a frame. 2. Code rules decide first. Line drawing: lines pass a box of code rules and get the marks page furniture, role and author change. 3. Apertus writes no text. Line drawing: the document and one question go into Apertus. A head gives a bar for each of two options, and no text comes out. 4. Data with its source. Line drawing: a record with values. A marker stroke joins one value to its line on the page. One value has a dashed frame with the word unsure.</desc>
