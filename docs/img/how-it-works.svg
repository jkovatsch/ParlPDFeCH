.dl { fill: none; stroke: #1B1D22; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.dg { fill: none; stroke: #5A5F6B; stroke-width: 1.6; stroke-linecap: round; }
.dd { fill: none; stroke: #1B1D22; stroke-width: 1.1; stroke-dasharray: 3 2.5; }
.dc { fill: #FBFAF6; stroke: #1B1D22; stroke-width: 1; }
.dm { fill: #F2C14E; stroke: #1B1D22; stroke-width: 1; }
.df { fill: #1B1D22; }
.dw { fill: none; stroke: #F2C14E; stroke-width: 7; stroke-linecap: round; }
.dt { font: 9.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1B1D22; }
.ds { font-size: 8.6px; }
.db { font-weight: 700; }
.ti { font: 700 13.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1B1D22; }
.ca { font: 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1B1D22; }
.no { font: italic 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #5A5F6B; }
.nu { font: 700 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1B1D22; }
</style>
