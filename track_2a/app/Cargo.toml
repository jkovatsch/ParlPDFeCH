# Workspace of the ParlPDFeCH package. See CONTRACT.md chapter 1.
# Build offline: cargo build --offline --locked -p parlpdfech-server
[workspace]
resolver = "2"
members = ["server", "rdfcheck"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# server
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "multipart", "tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3.34"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "set-header", "limit", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }
tempfile = "3.27.0"
sha2 = "0.10.9"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
# rdfcheck (WebAssembly)
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
oxigraph = { version = "0.5.9", default-features = false, features = ["js"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.release.package.parlpdfech-rdfcheck]
opt-level = "s"
