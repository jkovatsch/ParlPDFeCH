[package]
name = "parlpdfech-rdfcheck"
description = "RDF check in the browser: parses the TriG file, counts graphs and labels, runs SPARQL (CONTRACT.md chapter 7.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
console_error_panic_hook.workspace = true
oxigraph.workspace = true
# Same version that oxigraph 0.5.9 uses. It gives the query form (SELECT, ASK, ...) before the run.
spargebra = "0.4.6"
