<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 196" width="910" height="196" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title id="t">Figure 1: the pipeline from a parliament PDF to a validated eCH-0295 record</title>
<desc id="d">One row of stages: text blocks from Docling; rule files from the PDF alone; cascade of eCH-0295; rule readers; calibration; writer (record, labels, values.ttl); validator of the 3 files; app (values from the rules). Below the rule readers: the Apertus heads, which give 2 tiers to the readers, for 2 of the 7 fields. Below on the left: the OpenParlData export, which is the reference of the measurement and gives no value at run time. The file type of each stage output is below its box.</desc>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="910" height="196" fill="#fff"/>
<rect x="6" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="56.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">1 Text</text>
<text x="56.0" y="42" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">blocks</text>
<text x="56.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">Docling, OCR</text>
<text x="56.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">JSON</text>
<line x1="106" y1="39.0" x2="119" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="120" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="170.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">2 Rule files</text>
<text x="170.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">from the PDF alone:</text>
<text x="170.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">rule role, block roles</text>
<text x="170.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">JSON</text>
<line x1="220" y1="39.0" x2="233" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="234" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="284.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">3 Cascade</text>
<text x="284.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">kind and type</text>
<text x="284.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">select the slots</text>
<text x="284.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">YAML</text>
<line x1="334" y1="39.0" x2="347" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="348" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="398.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">4 Rule</text>
<text x="398.0" y="42" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">readers</text>
<text x="398.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">7 head values</text>
<text x="398.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">JSON</text>
<line x1="448" y1="39.0" x2="461" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="462" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="512.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">5 Calibration</text>
<text x="512.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">p for each tier,</text>
<text x="512.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">certain or unsure</text>
<text x="512.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">JSON</text>
<line x1="562" y1="39.0" x2="575" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="576" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="626.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">7a Writer</text>
<text x="626.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">eCH-0295 record,</text>
<text x="626.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">labels, values.ttl</text>
<text x="626.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">Turtle, YAML</text>
<line x1="676" y1="39.0" x2="689" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="690" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="740.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">7b Validator</text>
<text x="740.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">checks the</text>
<text x="740.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">3 files</text>
<text x="740.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">JSON</text>
<line x1="790" y1="39.0" x2="803" y2="39.0" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="804" y="8" width="100" height="62" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="854.0" y="27" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">8 App</text>
<text x="854.0" y="45" text-anchor="middle" font-size="10.5" fill="#333">browser page;</text>
<text x="854.0" y="60" text-anchor="middle" font-size="10.5" fill="#333">values from rules</text>
<text x="854.0" y="86" text-anchor="middle" font-size="10.5" fill="#111">HTML</text>
<rect x="348" y="108" width="214" height="52" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="455.0" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">6 Apertus heads</text>
<text x="455.0" y="141" text-anchor="middle" font-size="10.5" fill="#333">stored hidden states, linear heads,</text>
<text x="455.0" y="154" text-anchor="middle" font-size="10.5" fill="#333">2 of 7 fields: affair type, first author</text>
<line x1="436" y1="107" x2="436" y2="71" stroke="#222" stroke-width="1" marker-end="url(#a)"/>
<rect x="6" y="108" width="328" height="52" fill="#fff" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="170.0" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">OpenParlData export (register)</text>
<text x="170.0" y="141" text-anchor="middle" font-size="10.5" fill="#333">reference of the measurement; fit labels of the heads</text>
<text x="170.0" y="154" text-anchor="middle" font-size="10.5" fill="#333">on development documents; no value at run time</text>
<text x="6" y="184" font-size="10.5" fill="#111">Apertus writes no text. Each value has a probability. Each value has a page and a span, except an affair type from Q1.</text>
</svg>
