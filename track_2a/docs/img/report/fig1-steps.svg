<title id="t">The four steps of make convert, from left to right</title>
<desc id="d">Four line drawings in a row, from left to right. First: a PDF page with dashed text blocks, an arrow, and a list of lines, each line in a frame. Second: lines go into a box with braces for the code rules. Marks come out: a page with a marked top and bottom, a tag, and a person who changes to another person. Third: a document and a question go into Apertus, a grid with one yellow cell. A long bar has a check mark, a short bar has a cross. A speech bubble is crossed out: no text comes out. Fourth: a record with values, each with a dark bar. A yellow marker joins one value to its line on a PDF page. One value has a dashed frame.</desc>
