<title id="t">How Apertus is read out, and how a linear head gives a probability</title>
<desc id="d">Two line drawings. Left: a page has an arrow into a large box with a grid of small cells, and a long arrow goes up at the left side of the grid. A stack of speech bubbles with a question mark has an arrow into the box below the right columns; a grey line parts these columns from the others. In the right column, one cell above the middle is yellow. An arrow takes it out to a column of yellow cells, and a further arrow goes down to a storage drum. Right: Top part: a column of yellow cells, the state, goes through many lines into a funnel, the head. An arrow leads to one dark bar for each option; one bar is long and has a check mark. Bottom part: a page with blocks. Each block leads to its own yellow cell and to a copy of the same small funnel, and each copy gives one bar. The yellow block has the long bar with a check mark.</desc>
