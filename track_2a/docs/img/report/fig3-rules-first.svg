<title id="t">Rules first, then a head; and what make convert adds</title>
<desc id="d">Two line drawings. Left: a box with braces for the code rules has arrows to a long bar, a short bar and an empty frame. Each has a mark at its middle. The long bar passes the mark: a check mark and an arrow join it to a record. The short bar, for the first author only, and the empty frame get a cross. Their arrows go to a yellow cell and a funnel. The bar of the funnel passes its own mark, and an arrow joins it to a further place in the record. Right: a record has a yellow row. A yellow marker joins this row to a yellow line on a PDF page, under a magnifier. Another record has a crossed-out row. Below, a long bar and a shorter bar run across a hatched band around a mark. The long bar ends after the band and has an arrow to a plain oval. The shorter bar ends inside the band, after the mark, and has an arrow to a hatched oval.</desc>
