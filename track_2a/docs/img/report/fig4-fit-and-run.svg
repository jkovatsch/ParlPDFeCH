<title id="t">How the heads were fitted, and the one fixed run</title>
<desc id="d">Two line drawings. Left: a row of boxes, each with small grey parliament buildings. A brace over all boxes points to a funnel with a lock. Under the row, arrows from the white boxes go into a further funnel. A yellow line goes from the yellow box through this funnel down to a row of check marks and crosses. A cycle arrow is next to the funnel. A double arrow joins the marks to a table. After the marks, a box split in half holds a check mark and a cross, and an arrow goes to a bar. Right: on the left, a frame with grey parliament buildings; on the right, a frame with other parliament buildings, in black. Between them, a box with braces and a funnel has a lock. Arrows go from the left frame to the box and from the box to the right frame. Under the right frame, a record and a table have a double arrow between them. Below, a tag and a person each have a pair of dark bars: the lower bar is longer by a yellow part.</desc>
