    - text: <p>COMMUNE DE</p><p>VAL DE BAGNES</p><p>Autorités communales Conseil municipal</p><h2>PREAVIS DU CONSEIL MUNICIPAL SUR LE POSTULAT</h2><h2>de Mme Tristan et Mme Heinis du 30.03.2023</h2><p>intitulé « Fonds d'aide au maintien des petits commerces et cafés du villages»</p><p>En séance du 18 avril, le Conseil municipal a pris connaissance du postulat déposé auprès du bureau par Mme Tristan et Mme. Heinis concernant la constitution d'un fonds d'aide au maintien des petits commerces et cafés dans les villages.</p><p>Le Conseil a demandé à la commission « Finances et gestion » de préaviser le dossier pour s'assurer de la faisabilité juridique, financière et opérationnelle des démarches proposées. En amont de l'entrée en matière, le Conseil municipal porte à la connaissance des membres du Conseil général</p><h2>Commerces de proximité</h2><p>L'importance du maintien des commerces de proximité dans les villages de montagne ne relève d'aucune contestation. Les magasins sont des lieux d'échanges de produits et surtout d'échanges humains indéniables. Ils jouent ainsi un rôle social avéré.</p><h2>Bases légales</h2><p>Ces dernières années, la Commune a été approchée à quelques reprises pour des demandes de soutiens financiers. Malheureusement, sans bases légales, il n'est pas possible d'octroyer des aides qui les justifieraient. L'interrogation réside dans les limites du champ d'application de ces aides. Aussi, pourquoi tels secteurs privés devraient être soutenus par la Commune et pas d'autres ?</p><h2>Prochaines étapes</h2><p>La création d'un fonds nécessiterait donc un nouveau règlement. Avant d'en arriver là, et pour respecter la volonté des dépositaires du postulat - s'il est accepté par le Conseil général - l'Administration devrait mandater un bureau pour l'accompagner dans la réflexion avec l'appui du nouveau délégué à la promotion économique. L'étude qui résulterait du postulat permettrait de se doter d'un éventuel règlement.</p><p>Saluant la démarche proposée, le Conseil municipal préavise favorablement ce postulat et recommande aux membres du Conseil général de l'approuver.</p><p>Approuvé en séance du Conseil municipal du 20 juin 2023</p><p>Pour le Conseil municipal</p><p>Christophe Maret Président</p><p>Pierre-Martin Moulin Secrétaire général</p><p>Autorités communales - Conseil municipal Route de Clouchèvre 44, 1934 Le Châble VS Tel. 027 777 11 00 - etat-major@valdebagnes.ch</p><p><a href="http://www.valdebagnes.ch">www.valdebagnes.ch</a></p>
